[project]
name = "companymgmt-api"
version = "0.1.0"
description = "CompanyMgmt API: multi-tenant company management"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.43",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.10",
    "cryptography>=45",
    "pyotp>=2.9",
    "httpx>=0.28",
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
    "ruff>=0.13",
    "mypy>=1.18",
    "import-linter>=2.5",
    "pypdf>=5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "DTZ"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "DTZ001"]
"migrations/**" = ["E501", "C408"]
"app/modules/platform/emails.py" = ["E501", "RUF001"]
"scripts/demo_seed.py" = ["S105", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyotp.*", "weasyprint.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Core does not depend on modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "Modules never depend on the AI layer"
type = "forbidden"
source_modules = ["app.modules", "app.core"]
forbidden_modules = ["app.ai"]

[[tool.importlinter.contracts]]
name = "Modules only depend on the modules below them"
type = "layers"
layers = [
    "app.modules.privacy",
    "app.modules.payroll",
    "app.modules.attendance | app.modules.leave",
    "app.modules.people",
    "app.modules.platform",
]
