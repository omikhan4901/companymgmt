version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: monthly }
